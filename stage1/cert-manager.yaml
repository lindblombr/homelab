---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: default
spec:
  interval: 30m
  targetNamespace: cert-manager
  install:
    createNamespace: true
  chart:
    kind: OCIRepository
    spec:
      interval: 6h
      url: oci://quay.io/jetstack/charts/cert-manager
      ref:
        semver: '1.21.*'
  values:
    installCRDs: true
