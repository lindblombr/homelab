---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: default
spec:
  interval: 30m
  targetNamespace: envoy-gateway-system
  install:
    createNamespace: true
  chart:
    kind: OCIRepository
    spec:
      interval: 6h
      url: oci://docker.io/envoyproxy/gateway-helm
      ref:
        semver: '1.10.*'
  values:
    installCRDs: true
