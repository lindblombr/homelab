---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: default
spec:
  interval: 30m
  targetNamespace: prometheus-system
  install:
    createNamespace: true
  chart:
    kind: OCIRepository
    spec:
      interval: 6h
      url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
      ref:
        semver: '93.4.*'
